
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Voxel Frontier 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#102333dd;padding:12px;border-radius:12px;font-size:13px}
button{background:#18394b;color:white;border:1px solid #ffffff66;border-radius:10px;padding:12px;font-weight:bold}
#actions{position:fixed;right:10px;bottom:90px;display:grid;gap:7px}
#move{position:fixed;left:10px;bottom:20px;display:grid;grid-template-columns:repeat(3,48px);gap:4px}
#move button{height:45px;padding:0;font-size:18px}
#bar{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);display:flex;gap:4px}
.slot{padding:9px 7px;font-size:11px}.active{border:2px solid #ffe66b}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:23px;text-shadow:0 0 4px black}
#start{position:fixed;inset:0;background:#061725cc;display:grid;place-items:center;text-align:center}
#card{background:#102333f2;padding:25px;border-radius:20px;width:min(90%,420px)}
#card h1{font-size:34px;margin:0;color:#7fffd4}
#card p{line-height:1.6;color:#d7e6ee}
@media(min-width:800px){#move{display:none}}
</style>
</head>
<body>
<div id="hud">
 <div class="panel"><b>VOXEL FRONTIER</b><br><span id="mode">CREATIVE</span></div>
 <div class="panel">❤️ <span id="hp">100</span><br>World: Greenwild</div>
</div>
<div id="cross">+</div>
<div id="move">
 <button data-m="f" style="grid-column:2">▲</button>
 <button data-m="l">◀</button><button data-m="b">▼</button><button data-m="r">▶</button>
 <button id="jump" style="grid-column:2">⤒</button>
</div>
<div id="actions">
 <button id="break">⛏ Break</button><button id="place">▣ Place</button>
 <button id="camera">◉ Camera</button><button id="modebtn">Survival</button>
 <button id="save">Save World</button><button id="load">Load World</button>
</div>
<div id="bar">
 <button class="slot active" data-id="1">🌿 Grass</button>
 <button class="slot" data-id="2">🟫 Dirt</button>
 <button class="slot" data-id="3">🪨 Stone</button>
 <button class="slot" data-id="4">🪵 Wood</button>
</div>
<div id="start"><div id="card">
 <h1>VOXEL FRONTIER</h1>
 <p>Explore, mine, build and survive in your own 3D world.</p>
 <button id="enter" style="background:#168b70;padding:15px 28px">▶ ENTER WORLD</button>
 <p style="font-size:11px">Desktop: WASD + drag mouse<br>Tablet: use the arrows and drag the world to look around.</p>
 </div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=> {
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91cbed);
scene.fog=new THREE.Fog(0x91cbed,35,95);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf3ff,0x596347,2));
const sun=new THREE.DirectionalLight(0xffedce,2.5);
sun.position.set(-20,35,15);sun.castShadow=true;scene.add(sun);
const mats={
 1:new THREE.MeshStandardMaterial({color:0x5c9b46,roughness:1}),
 2:new THREE.MeshStandardMaterial({color:0x80583b,roughness:1}),
 3:new THREE.MeshStandardMaterial({color:0x888d91,roughness:.9}),
 4:new THREE.MeshStandardMaterial({color:0x98623a,roughness:1}),
 5:new THREE.MeshStandardMaterial({color:0x2d7540,roughness:1}),
 6:new THREE.MeshStandardMaterial({color:0xd9c27c,roughness:1}),
 7:new THREE.MeshStandardMaterial({color:0x368bc5,transparent:true,opacity:.7,roughness:.2})
};
const geo=new THREE.BoxGeometry(1,1,1);
const blocks=new Map(),meshes=[];
const key=(x,y,z)=>`${x},${y},${z}`;
let selected=1,yaw=0,pitch=0,third=false,survival=false,started=false,vy=0,grounded=false;
let hp=100,player=new THREE.Group(),body;
let inventory={1:50,2:50,3:30,4:20};
const pressed={};let moves={f:false,b:false,l:false,r:false};
function rand(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function height(x,z){return Math.floor(3+Math.sin(x*.14)*2+Math.cos(z*.13)*2+Math.sin((x+z)*.2))}
function addBlock(x,y,z,id){
 const k=key(x,y,z);if(blocks.has(k))return;
 const m=new THREE.Mesh(geo,mats[id]||mats[1]);
 m.position.set(x+.5,y+.5,z+.5);m.castShadow=true;m.receiveShadow=true;
 m.userData={x,y,z,id};scene.add(m);blocks.set(k,m);meshes.push(m);return m;
}
function makeWorld(){
 for(let x=-25;x<=25;x++)for(let z=-25;z<=25;z++){
  let h=height(x,z),desert=rand(Math.floor(x/8),Math.floor(z/8))<.15;
  for(let y=0;y<=h;y++)addBlock(x,y,z,y===h?(desert?6:1):(y>h-3?2:3));
  if(rand(x+70,z-20)>.975&&Math.abs(x)>2&&Math.abs(z)>2){
   let trunk=3+Math.floor(rand(x,z)*2);
   for(let y=1;y<=trunk;y++)addBlock(x,h+y,z,4);
   for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=trunk-1;dy<=trunk+1;dy++)
    if(Math.abs(dx)+Math.abs(dz)<4&&rand(x+dx*7+dy,z+dz*3)>.15)addBlock(x+dx,h+dy,z+dz,5);
  }
 }
 const water=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mats[7]);
 water.rotation.x=-Math.PI/2;water.position.y=2.3;scene.add(water);
 for(let i=0;i<10;i++){
  const cloud=new THREE.Group();
  for(let j=0;j<4;j++){let c=new THREE.Mesh(new THREE.BoxGeometry(3,1,2),new THREE.MeshStandardMaterial({color:0xffffff}));c.position.x=j*2;cloud.add(c)}
  cloud.position.set(rand(i,5)*70-35,19+rand(i,6)*5,rand(i,7)*70-35);scene.add(cloud);
 }
}
makeWorld();
body=new THREE.Mesh(new THREE.CapsuleGeometry(.3,.7,4,8),new THREE.MeshStandardMaterial({color:0x1a9a84}));
body.position.y=.85;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,10),new THREE.MeshStandardMaterial({color:0xe3b58b}));
head.position.y=1.45;player.add(head);
player.position.set(0,height(0,0)+1,0);scene.add(player);
function target(){
 const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=ray.intersectObjects(meshes,false);return hits.length&&hits[0].distance<7?hits[0]:null;
}
function breakBlock(){
 const h=target();if(!h)return;
 const d=h.object.userData;if(d.y<=0)return;
 scene.remove(h.object);blocks.delete(key(d.x,d.y,d.z));
 const i=meshes.indexOf(h.object);if(i>=0)meshes.splice(i,1);
 inventory[d.id]=(inventory[d.id]||0)+1;
}
function placeBlock(){
 const h=target();if(!h)return;
 const d=h.object.userData,n=h.face.normal;
 const x=d.x+Math.round(n.x),y=d.y+Math.round(n.y),z=d.z+Math.round(n.z);
 if(y<0||y>35)return;
 if(survival&&(inventory[selected]||0)<=0)return;
 if(survival)inventory[selected]--;
 addBlock(x,y,z,selected);
}
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
 selected=+b.dataset.id;document.querySelectorAll('[data-id]').forEach(x=>x.classList.toggle('active',x===b));
});
document.querySelectorAll('[data-m]').forEach(b=>{
 const m=b.dataset.m;
 b.onpointerdown=e=>{e.preventDefault();moves[m]=true};
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>moves[m]=false));
});
document.getElementById('break').onclick=breakBlock;
document.getElementById('place').onclick=placeBlock;
document.getElementById('jump').onclick=()=>{if(grounded){vy=7;grounded=false}};
document.getElementById('camera').onclick=()=>{third=!third};
document.getElementById('modebtn').onclick=()=>{survival=!survival;document.getElementById('mode').textContent=survival?'SURVIVAL':'CREATIVE';document.getElementById('modebtn').textContent=survival?'Creative':'Survival'};
document.getElementById('save').onclick=()=>{try{localStorage.setItem('vf-save',JSON.stringify({blocks:[...blocks.entries()].map(([k,m])=>[k,m.userData.id]),pos:player.position.toArray(),inventory,survival,hp}));alert('World saved on this device!')}catch(e){alert('Save failed')}};
document.getElementById('load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem('vf-save'));if(!d)return alert('No saved world');blocks.forEach(m=>scene.remove(m));blocks.clear();meshes.length=0;d.blocks.forEach(([k,id])=>{let [x,y,z]=k.split(',').map(Number);addBlock(x,y,z,id)});player.position.fromArray(d.pos);inventory=d.inventory;survival=d.survival;hp=d.hp;alert('World loaded')}catch(e){alert('Could not load save')}};
document.getElementById('enter').onclick=()=>{started=true;document.getElementById('start').style.display='none'};
document.addEventListener('keydown',e=>{pressed[e.code]=true;if(e.code==='Space'&&grounded){vy=7;grounded=false}if(/^Digit[1-4]$/.test(e.code)){selected=+e.code.slice(5);document.querySelectorAll('[data-id]').forEach(b=>b.classList.toggle('active',+b.dataset.id===selected))}});
document.addEventListener('keyup',e=>pressed[e.code]=false);
let drag=null;
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!started)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw-=dx*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch-dy*.003));drag={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',()=>drag=null);
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;
 if(started){
  let f=(pressed.KeyW||pressed.ArrowUp||moves.f?1:0)-(pressed.KeyS||pressed.ArrowDown||moves.b?1:0);
  let s=(pressed.KeyD||moves.r?1:0)-(pressed.KeyA||moves.l?1:0);
  let speed=pressed.ShiftLeft?7:4.5;
  player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed*dt;
  player.position.z+=(Math.cos(yaw)*f-Math.sin(yaw)*s)*speed*dt;
  vy-=18*dt;player.position.y+=vy*dt;
  let g=height(Math.round(player.position.x),Math.round(player.position.z))+1;
  if(player.position.y<g){player.position.y=g;vy=0;grounded=true}else grounded=false;
  player.position.x=Math.max(-29,Math.min(29,player.position.x));player.position.z=Math.max(-29,Math.min(29,player.position.z));
 }
 if(third){camera.position.set(player.position.x-Math.sin(yaw)*4,player.position.y+2,player.position.z-Math.cos(yaw)*4);camera.lookAt(player.position.x,player.position.y+1,player.position.z)}
 else{camera.position.set(player.position.x,player.position.y+1.4,player.position.z);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
